<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div id="aviso-a4" data-screen-label="Inscripciones abiertas · A4" style="position:relative;width:1240px;height:1754px;overflow:hidden;background:var(--brand-primary);font-family:var(--font-body);color:#fff">
<div style="position:absolute;inset:0;background:var(--gradient-hero-rich)"></div>
<img src="../../../assets/promociones/arco-blanco.png" alt="" style="position:absolute;left:-200px;bottom:300px;width:880px;opacity:.07">
<div style="position:absolute;right:-200px;top:-170px;width:900px;height:900px;border-radius:50%;border:16px solid var(--brand-accent);box-sizing:border-box"></div>
<div style="position:absolute;right:-178px;top:-148px;width:856px;height:856px;border-radius:50%;overflow:hidden;background:var(--blue-900)">
<img src="{{ fotoSrc }}" alt="Estudiantes del CFP 401" style="width:100%;height:100%;object-fit:cover;object-position:center">
<div style="position:absolute;inset:0;background:linear-gradient(200deg,rgba(0,40,120,0) 45%,rgba(0,40,120,.5) 100%)"></div>
</div>
<img src="../../../assets/promociones/logo-blanco.png" alt="CFP N° 401 Avellaneda" style="position:absolute;left:90px;top:90px;width:380px;height:auto;display:block">
<sc-if value="{{ conSello }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:560px;top:470px;width:250px;height:250px;border-radius:50%;background:var(--brand-accent);color:var(--blue-900);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-12deg);box-shadow:12px 12px 0 var(--blue-900)">
<div style="font-family:var(--font-display);font-weight:800;font-size:74px;line-height:1;letter-spacing:-.03em">{{ selloGrande }}</div>
<div style="font-family:var(--font-display);font-weight:700;font-size:27px;letter-spacing:.1em;margin-top:6px">{{ selloChico }}</div>
</div>
</sc-if>
<div style="position:absolute;left:90px;right:90px;bottom:330px;display:flex;flex-direction:column;align-items:flex-start">
<div style="display:flex;align-items:center;gap:20px;font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:.16em;color:var(--brand-accent)"><span style="width:64px;height:9px;background:var(--brand-accent)"></span><span>{{ antetitulo }}</span></div>
<div style="margin-top:26px;font-family:var(--font-display);font-weight:800;font-size:140px;line-height:.95;letter-spacing:-.045em;color:#fff;max-width:1060px;overflow-wrap:anywhere;text-wrap:balance">{{ linea1 }}</div>
<div style="margin-top:22px;margin-left:-8px;background:var(--brand-accent);color:var(--blue-900);font-family:var(--font-display);font-weight:800;font-size:140px;line-height:1;letter-spacing:-.045em;max-width:1000px;overflow-wrap:anywhere;text-wrap:balance;padding:6px 38px 18px;border-radius:28px;transform:rotate(-2deg);box-shadow:14px 14px 0 var(--blue-900)">{{ linea2 }}</div>
<div style="margin-top:42px;max-width:900px;font-size:36px;font-weight:600;line-height:1.3;text-wrap:pretty">{{ bajada }}</div>
<sc-if value="{{ conCursos }}" hint-placeholder-val="{{ true }}">
<div style="margin-top:32px;display:flex;flex-wrap:wrap;gap:14px;max-width:1060px">
<sc-for list="{{ cursos }}" as="c" hint-placeholder-count="5"><span style="border:3px solid rgba(255,255,255,.75);border-radius:999px;padding:10px 26px;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.02em;white-space:nowrap">{{ c }}</span></sc-for>
</div>
</sc-if>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:260px;background:#fff;color:var(--blue-900);display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:48px;padding:0 90px;border-top:14px solid var(--brand-accent)">
<div style="display:flex;flex-direction:column;gap:10px"><div style="font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--brand-primary)">{{ dato1Label }}</div><div style="font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1.05;text-wrap:balance">{{ dato1 }}</div></div>
<div style="display:flex;flex-direction:column;gap:10px"><div style="font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--brand-primary)">{{ dato2Label }}</div><div style="font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1.05;text-wrap:balance">{{ dato2 }}</div></div>
<div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px"><div style="font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.14em;color:var(--brand-primary);white-space:nowrap">WHATSAPP</div><div style="background:var(--blue-900);color:var(--brand-accent);font-family:var(--font-display);font-weight:800;font-size:48px;line-height:1;padding:18px 36px;border-radius:999px;white-space:nowrap">{{ whatsapp }}</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:1754},&quot;antetitulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CICLO LECTIVO 2027&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Titular&quot;},&quot;linea1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;INSCRIPCIONES&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Titular&quot;},&quot;linea2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABIERTAS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Titular&quot;},&quot;bajada&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Cursos de formación profesional con certificación oficial DGCyE.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Titular&quot;},&quot;cursos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Soldadura, Electricidad, Energías renovables, Domótica, Refrigeración&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Cursos&quot;},&quot;mostrarCursos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cursos&quot;},&quot;mostrarSello&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sello&quot;},&quot;selloGrande&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100%&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sello&quot;},&quot;selloChico&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GRATUITO&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sello&quot;},&quot;dato1Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;INSCRIPCIÓN&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;dato1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Desde el 1/12&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;dato2Label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SEDE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;dato2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;J. P. Angulo 1272&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;11 6105-6018&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Datos&quot;},&quot;foto&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Egresados&quot;,&quot;Fachada&quot;,&quot;Electricidad&quot;,&quot;Soldadura&quot;],&quot;default&quot;:&quot;Egresados&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Imagen&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const fotos = { 'Egresados': '../../../assets/fotos/hero-egresados.jpg', 'Fachada': '../../../assets/fotos/fachada-cfp401.jpg', 'Electricidad': '../../../assets/fotos/hero-electricidad.jpg', 'Soldadura': '../../../assets/fotos/hero-soldadura.jpg' };
    const cursos = (p.cursos ?? 'Soldadura, Electricidad, Energías renovables, Domótica, Refrigeración').split(',').map(s => s.trim()).filter(Boolean).slice(0, 8);
    return {
      fotoSrc: fotos[p.foto] || fotos.Egresados,
      antetitulo: p.antetitulo ?? 'CICLO LECTIVO 2027',
      linea1: p.linea1 ?? 'INSCRIPCIONES',
      linea2: p.linea2 ?? 'ABIERTAS',
      bajada: p.bajada ?? 'Cursos de formación profesional con certificación oficial DGCyE.',
      cursos,
      conCursos: (p.mostrarCursos ?? true) && cursos.length > 0,
      conSello: p.mostrarSello ?? true,
      selloGrande: p.selloGrande ?? '100%',
      selloChico: p.selloChico ?? 'GRATUITO',
      dato1Label: p.dato1Label ?? 'INSCRIPCIÓN',
      dato1: p.dato1 ?? 'Desde el 1/12',
      dato2Label: p.dato2Label ?? 'SEDE',
      dato2: p.dato2 ?? 'J. P. Angulo 1272',
      whatsapp: p.whatsapp ?? '11 6105-6018'
    };
  }
}
</script>
</body>
</html>
