<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visita de SIMMA Grupo Empresas · Feed CFP 401</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
    body { background: #002878; }
    .artboard {
      position: relative;
      isolation: isolate;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #003890 0%, #002878 100%);
      font-family: 'Source Sans 3', Arial, sans-serif;
    }
    .top-accent { position: absolute; inset: 0 0 auto; z-index: 5; height: 14px; background: #ffd100; }
    .photo {
      position: absolute; z-index: -2; inset: 14px 0 auto;
      width: 1080px; height: 660px; object-fit: cover; object-position: center 53%;
    }
    .photo-shade {
      position: absolute; z-index: -1; inset: 14px 0 auto; height: 660px;
      background: linear-gradient(180deg, rgba(0,40,120,.03) 35%, rgba(0,40,120,.16) 67%, #002878 100%);
    }
    .blue-panel {
      position: absolute; inset: 626px 0 0;
      background: linear-gradient(135deg, #003890 0%, #002878 77%);
    }
    .grid {
      position: absolute; inset: 626px 0 0; z-index: 0; opacity: .12; pointer-events: none;
      background-image: linear-gradient(rgba(192,208,240,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(192,208,240,.045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(90deg, transparent, #000 18%, #000 86%, transparent);
    }
    .content { position: absolute; z-index: 1; left: 78px; right: 78px; top: 696px; }
    .eyebrow {
      display: flex; align-items: center; gap: 16px;
      color: #ffd100; font: 700 28px/1.2 'Poppins', Arial, sans-serif;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow::before { content: ''; display: block; width: 54px; height: 5px; background: #ffd100; }
    h1 { margin: 22px 0 0; font-family: 'Poppins', Arial, sans-serif; font-weight: 800; text-transform: uppercase; }
    h1 .simma { display: block; font-size: 104px; line-height: 1.04; letter-spacing: -.035em; }
    h1 .group { display: block; margin-top: 2px; color: #ffd100; font-size: 61px; line-height: 1.08; letter-spacing: -.035em; white-space: nowrap; }
    .divider { width: 86px; height: 7px; margin: 27px 0 20px; background: #ffd100; }
    .deck { max-width: 895px; margin: 0; color: #fff; font: 600 37px/1.25 'Source Sans 3', Arial, sans-serif; }
    .footer { position: absolute; z-index: 1; left: 78px; right: 78px; bottom: 36px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: block; width: 490px; height: auto; object-fit: contain; }
    .bottom-accent { position: absolute; inset: auto 0 0; z-index: 2; height: 12px; background: #ffd100; }
  </style>
</head>
<body>
  <main class="artboard" id="artboard" aria-label="Publicación institucional sobre la visita de SIMMA Grupo Empresas">
    <div class="top-accent"></div>
    <img class="photo" src="../Imágenes%20fuente/WhatsApp%20Image%202026-10-15%20at%207.21.07%20PM.jpeg" alt="Estudiantes participan de una capacitación en el aula, junto a representantes de SIMMA Grupo Empresas">
    <div class="photo-shade"></div>
    <div class="blue-panel"></div>
    <div class="grid"></div>
    <section class="content">
      <div class="eyebrow">Nos visitó</div>
      <h1><span class="simma">SIMMA</span><span class="group">Grupo Empresas</span></h1>
      <div class="divider"></div>
      <p class="deck">Capacitación para nuestros estudiantes sobre máquinas y herramientas.</p>
    </section>
    <footer class="footer">
      <img class="logo" src="../../skill/cfp401-estudio/assets/logos/logo-cfp401-horizontal-blanco.png" alt="Centro de Formación Profesional N° 401 Avellaneda">
    </footer>
    <div class="bottom-accent"></div>
  </main>
</body>
</html>
