<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-body);background:var(--surface-card)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11px;font-family:var(--font-mono)"><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-page);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-page</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-card);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-card</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-subtle);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-subtle</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-brand);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-brand</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-brand-soft);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-brand-soft</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-accent);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-accent</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-accent-soft);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-accent-soft</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--surface-inverse);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--surface-inverse</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--text-title);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--text-title</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--text-body);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--text-body</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--text-muted);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--text-muted</span></div><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:6px;background:var(--border-subtle);border:1px solid var(--border-subtle);flex:0 0 26px"></span><span style="color:var(--text-muted)">--border-subtle</span></div></div></body></html>
