<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-body);background:var(--surface-card)}</style></head><body><div style="display:flex;gap:16px"><div style="flex:1;background:var(--state-success-bg);border-radius:10px;padding:14px 16px"><div style="font-family:var(--font-display);font-weight:700;color:var(--state-success-fg);font-size:15px">Éxito</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--state-success-fg);opacity:.8;margin-top:4px">--state-success-fg</div></div><div style="flex:1;background:var(--state-warning-bg);border-radius:10px;padding:14px 16px"><div style="font-family:var(--font-display);font-weight:700;color:var(--state-warning-fg);font-size:15px">Advertencia</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--state-warning-fg);opacity:.8;margin-top:4px">--state-warning-fg</div></div><div style="flex:1;background:var(--state-danger-bg);border-radius:10px;padding:14px 16px"><div style="font-family:var(--font-display);font-weight:700;color:var(--state-danger-fg);font-size:15px">Error</div><div style="font-size:11px;font-family:var(--font-mono);color:var(--state-danger-fg);opacity:.8;margin-top:4px">--state-danger-fg</div></div></div></body></html>
