<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Campus Virtual — CFP N° 401 Avellaneda</title>
<link rel="icon" href="../../assets/Logos/favicon.png"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<body><div id="root"></div>
<script type="text/babel">
// --- LoginScreen.jsx ---
const {Button,Input,Checkbox,Card,Callout,Icon}=window.CFP401AvellanedaDesignSystem_6c39ff;
function LoginScreen({onLogin}){
  const [u,setU]=React.useState('39482116');
  return <div style={{minHeight:'100vh',display:'grid',gridTemplateColumns:'1.05fr .95fr'}}>
    <div style={{background:'var(--gradient-hero)',color:'#fff',padding:'var(--space-16) var(--space-12)',display:'flex',flexDirection:'column',justifyContent:'center',position:'relative',overflow:'hidden'}}>
      <img src="../../assets/Logos/logo-isotipo.png" alt="" style={{position:'absolute',right:-80,bottom:-60,height:'80%',opacity:.08,}}/>
      <img src="../../assets/Logos/logo-campus-horizontal.png" alt="Campus Virtual" style={{width:360,background:'#fff',borderRadius:'var(--radius-lg)',padding:'var(--space-4)'}}/>
      <h1 style={{color:'#fff',fontSize:44,lineHeight:1.05,letterSpacing:'-.02em',marginTop:'var(--space-8)',maxWidth:520}}>Tu aula, tus materiales y tus entregas en un solo lugar</h1>
      <p style={{fontSize:18,lineHeight:1.6,color:'var(--blue-100)',maxWidth:480,marginTop:'var(--space-5)'}}>Ingresá con tu DNI y la clave que te dio tu docente. Si es tu primera vez, consultá en la sede.</p>
    </div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'var(--space-12)'}}>
      <Card padding="var(--space-8)" style={{width:420}}>
        <h2 style={{fontSize:26,marginBottom:'var(--space-2)'}}>Ingresar</h2>
        <p style={{marginTop:0,fontSize:15,color:'var(--text-muted)'}}>Campus Virtual · CFP N° 401 Avellaneda</p>
        <div style={{display:'grid',gap:'var(--space-5)',marginTop:'var(--space-6)'}}>
          <Input label="DNI" value={u} onChange={e=>setU(e.target.value)} hint="Sin puntos ni espacios"/>
          <Input label="Contraseña" type="password" value="••••••••"/>
          <Checkbox label="Mantener mi sesión iniciada" checked onChange={()=>{}}/>
          <Button variant="accent" size="lg" fullWidth onClick={onLogin}>Entrar al campus</Button>
          <a style={{fontSize:14,textAlign:'center'}}>¿Olvidaste tu contraseña?</a>
        </div>
        <Callout tone="info" style={{marginTop:'var(--space-6)'}}>Consultas por WhatsApp al 11 6105-6018 (solo mensajes).</Callout>
      </Card>
    </div>
  </div>;
}
</script>

<script type="text/babel">
// --- CampusShell.jsx ---
const {SideNav,Logo,Icon,Badge,Button}=window.CFP401AvellanedaDesignSystem_6c39ff;
function CampusShell({page,onNavigate,onLogout,children}){
  const items=[{label:'Inicio',icon:<Icon name="home" size={18}/>},{label:'Mis cursos',icon:<Icon name="book-open" size={18}/>,count:3},{label:'Curso',icon:<Icon name="graduation-cap" size={18}/>},{label:'Calificaciones',icon:<Icon name="clipboard-check" size={18}/>},{label:'Mensajes',icon:<Icon name="mail" size={18}/>,count:2}];
  return <div style={{display:'flex',minHeight:'100vh',background:'var(--surface-page)'}}>
    <div style={{display:'flex',flexDirection:'column',background:'var(--surface-inverse)'}}>
      <div style={{padding:'var(--space-6) var(--space-4) var(--space-2)'}}><img src="../../assets/Logos/logo-campus-horizontal.png" alt="Campus Virtual" style={{width:200,background:'#fff',borderRadius:'var(--radius-md)',padding:8}}/></div>
      <SideNav items={items} active={page} onNavigate={onNavigate} style={{flex:1}} footer={<a onClick={onLogout} style={{color:'var(--blue-200)',cursor:'pointer',fontSize:13}}>Cerrar sesión</a>}/>
    </div>
    <div style={{flex:1,minWidth:0}}>
      <header style={{background:'var(--surface-card)',borderBottom:'1px solid var(--border-subtle)',padding:'14px var(--space-8)',display:'flex',alignItems:'center',gap:'var(--space-4)'}}>
        <h2 style={{fontSize:20}}>{page}</h2>
        <Badge tone="brand" style={{marginLeft:'var(--space-2)'}}>Ciclo en curso</Badge>
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'var(--space-4)'}}>
          <Icon name="bell" size={20} color="var(--neutral-500)"/>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{width:34,height:34,borderRadius:'50%',background:'var(--brand-primary)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-display)',fontWeight:700,fontSize:14}}>MR</span>
            <div style={{lineHeight:1.2}}><div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:14,color:'var(--text-title)'}}>Micaela Ríos</div><div style={{fontSize:12,color:'var(--text-muted)'}}>Estudiante</div></div>
          </div>
        </div>
      </header>
      <main style={{padding:'var(--space-8)'}}>{children}</main>
    </div>
  </div>;
}
</script>

<script type="text/babel">
// --- DashboardScreen.jsx ---
const {Card,Button,Badge,ProgressBar,Alert,InfoList,SectionHeading,Icon,StatBlock}=window.CFP401AvellanedaDesignSystem_6c39ff;
const CAMPUS_COURSES=[{t:'Soldador MIG-TIG',doc:'Prof. R. Giménez',p:62,next:'Entrega: práctica de cordón horizontal · vie 19/09'},{t:'Instalador de Sistemas Domóticos',doc:'Prof. L. Sosa',p:38,next:'Clase sincrónica · mié 17/09 19:00 hs'},{t:'Creador de contenido audiovisual',doc:'Prof. A. Duarte',p:81,next:'Corrección de guion publicada'}];
function DashboardScreen({onOpenCourse}){
  return <div style={{display:'grid',gap:'var(--space-8)'}}>
    <Alert tone="info" onDismiss={()=>{}}>Recordá que la inscripción a los módulos del segundo cuatrimestre cierra el 30/09.</Alert>
    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:'var(--space-8)'}}>
      <div>
        <SectionHeading overline="Tus cursos" title="Continuá donde quedaste"/>
        <div style={{display:'grid',gap:'var(--space-5)',marginTop:'var(--space-6)'}}>
          {CAMPUS_COURSES.map(c=><Card key={c.t} hoverable accentBar padding="var(--space-5)" onClick={onOpenCourse}>
            <div style={{display:'flex',alignItems:'flex-start',gap:'var(--space-4)'}}>
              <div style={{flex:1}}>
                <h3 style={{fontSize:19}}>{c.t}</h3>
                <p style={{margin:'6px 0 0',fontSize:14,color:'var(--text-muted)'}}>{c.doc}</p>
              </div>
              <Badge tone={c.p>75?'success':'brand'}>{c.p>75?'Al día':'En curso'}</Badge>
            </div>
            <ProgressBar value={c.p} label="Avance" style={{marginTop:'var(--space-4)'}}/>
            <div style={{marginTop:'var(--space-4)',display:'flex',alignItems:'center',gap:'var(--space-3)',fontSize:14,color:'var(--text-body)'}}>
              <Icon name="calendar-clock" size={16} color="var(--brand-primary)"/>{c.next}
              <Button size="sm" variant="secondary" style={{marginLeft:'auto'}} onClick={onOpenCourse}>Entrar</Button>
            </div>
          </Card>)}
        </div>
      </div>
      <div style={{display:'grid',gap:'var(--space-6)',alignContent:'start'}}>
        <Card padding="var(--space-6)"><h3 style={{fontSize:17,marginBottom:'var(--space-4)'}}>Próximas fechas</h3>
          <InfoList dense items={[{label:'17/09',value:'Clase sincrónica de Domótica'},{label:'19/09',value:'Entrega práctica MIG-TIG'},{label:'30/09',value:'Cierre de inscripción a módulos'}]}/>
        </Card>
        <Card padding="var(--space-6)" style={{display:'flex',gap:'var(--space-8)'}}><StatBlock value="3" label="Cursos activos"/><StatBlock value="8,4" label="Promedio"/></Card>
        <Card padding="var(--space-6)"><h3 style={{fontSize:17,marginBottom:'var(--space-3)'}}>Ayuda</h3><p style={{margin:0,fontSize:14,color:'var(--text-muted)'}}>Escribinos por WhatsApp al 11 6105-6018 o acercate a la sede de 10 a 19 hs.</p></Card>
      </div>
    </div>
  </div>;
}
</script>

<script type="text/babel">
// --- CourseScreen.jsx ---
const {Card,Tabs,Badge,Button,Icon,ProgressBar,Callout,Alert,Modal,Input,InfoList}=window.CFP401AvellanedaDesignSystem_6c39ff;
function CourseScreen(){
  const [tab,setTab]=React.useState('Contenidos');
  const [open,setOpen]=React.useState(false);
  const [sent,setSent]=React.useState(false);
  const units=[{n:'Módulo 1',t:'Seguridad e higiene en soldadura',done:true,items:['Apunte: EPP en taller (PDF)','Video: preparación del puesto','Cuestionario 1']},{n:'Módulo 2',t:'Soldadura MIG: parámetros',done:true,items:['Apunte: gases y caudales (PDF)','Práctica guiada 2']},{n:'Módulo 3',t:'Cordón horizontal y vertical',done:false,items:['Consigna de entrega','Foro de dudas']}];
  return <div style={{display:'grid',gap:'var(--space-6)'}}>
    <Card padding="0">
      <div style={{background:'var(--gradient-hero)',color:'#fff',padding:'var(--space-8)',position:'relative',overflow:'hidden'}}>
        <img src="../../assets/Logos/logo-isotipo.png" alt="" style={{position:'absolute',right:-30,top:-30,height:'160%',opacity:.09,}}/>
        <Badge tone="accent">Metalmecánica</Badge>
        <h2 style={{color:'#fff',fontSize:34,marginTop:'var(--space-4)'}}>Soldador MIG-TIG</h2>
        <p style={{margin:'var(--space-3) 0 0',color:'var(--blue-100)',fontSize:16}}>Prof. R. Giménez · Lunes, miércoles y viernes de 17:50 a 21:50 hs · Sede Juan Pablo Angulo 1272</p>
        <ProgressBar value={62} label="Tu avance" style={{marginTop:'var(--space-6)',maxWidth:420}}/>
      </div>
      <div style={{padding:'0 var(--space-8)'}}><Tabs items={['Contenidos','Entregas','Calificaciones','Foro']} active={tab} onChange={setTab} style={{marginTop:'var(--space-6)'}}/></div>
      <div style={{padding:'var(--space-8)'}}>
        {tab==='Contenidos'&&<div style={{display:'grid',gap:'var(--space-5)'}}>
          {units.map(u=><div key={u.n} style={{border:'1px solid var(--border-subtle)',borderRadius:'var(--radius-md)',overflow:'hidden'}}>
            <div style={{display:'flex',alignItems:'center',gap:'var(--space-3)',padding:'var(--space-4) var(--space-5)',background:'var(--surface-subtle)'}}>
              <Icon name={u.done?'check-circle-2':'circle-dashed'} size={20} color={u.done?'var(--state-success-fg)':'var(--neutral-400)'}/>
              <strong style={{fontFamily:'var(--font-display)',fontSize:16,color:'var(--text-title)'}}>{u.n} · {u.t}</strong>
              {u.done&&<Badge tone="success" style={{marginLeft:'auto'}}>Completado</Badge>}
            </div>
            <ul style={{listStyle:'none',margin:0,padding:'var(--space-4) var(--space-5)',display:'grid',gap:10}}>
              {u.items.map(i=><li key={i} style={{display:'flex',alignItems:'center',gap:10,fontSize:15}}><Icon name="file-text" size={16} color="var(--brand-primary)"/><a style={{cursor:'pointer'}}>{i}</a></li>)}
            </ul>
          </div>)}
        </div>}
        {tab==='Entregas'&&<div style={{display:'grid',gap:'var(--space-5)',maxWidth:640}}>
          {sent&&<Alert tone="success">Tu entrega fue subida y está pendiente de corrección.</Alert>}
          <Callout tone="accent" title="Práctica de cordón horizontal">Entregá 3 fotos del cordón y el registro de parámetros. Vence el viernes 19/09 a las 23:59.</Callout>
          <Button variant="accent" onClick={()=>setOpen(true)} iconLeft={<Icon name="upload" size={18}/>}>Subir entrega</Button>
          <InfoList dense items={[{label:'Entrega 1:',value:'Cuestionario de seguridad — 9 (corregido)'},{label:'Entrega 2:',value:'Práctica guiada MIG — 8 (corregido)'}]}/>
        </div>}
        {tab==='Calificaciones'&&<table style={{width:'100%',borderCollapse:'collapse',fontSize:15}}><thead><tr>{['Instancia','Fecha','Nota'].map(h=><th key={h} style={{textAlign:'left',padding:'10px 12px',borderBottom:'2px solid var(--border-brand)',fontFamily:'var(--font-display)',fontSize:13,textTransform:'uppercase',letterSpacing:'.06em',color:'var(--blue-900)'}}>{h}</th>)}</tr></thead>
          <tbody>{[['Cuestionario de seguridad','12/04','9'],['Práctica guiada MIG','30/05','8'],['Cordón horizontal','pendiente','—']].map(r=><tr key={r[0]}>{r.map((c,i)=><td key={i} style={{padding:'10px 12px',borderBottom:'1px solid var(--border-subtle)',fontWeight:i===2?700:400,color:i===2?'var(--brand-primary)':'var(--text-body)'}}>{c}</td>)}</tr>)}</tbody></table>}
        {tab==='Foro'&&<div style={{display:'grid',gap:'var(--space-5)',maxWidth:680}}>
          {[['Prof. R. Giménez','Revisen el caudal de gas antes de la práctica del viernes.'],['Micaela R.','¿Se puede entregar el registro de parámetros en papel?']].map(([a,m])=><Card key={a} padding="var(--space-5)"><strong style={{fontFamily:'var(--font-display)',fontSize:15,color:'var(--text-title)'}}>{a}</strong><p style={{margin:'6px 0 0',fontSize:15,color:'var(--text-body)'}}>{m}</p></Card>)}
          <Input label="Escribir en el foro" placeholder="Tu mensaje…"/>
          <Button style={{justifySelf:'start'}}>Publicar</Button>
        </div>}
      </div>
    </Card>
    <Modal open={open} title="Subir entrega" onClose={()=>setOpen(false)} footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button><Button variant="accent" onClick={()=>{setSent(true);setOpen(false);setTab('Entregas')}}>Confirmar entrega</Button></>}>
      <div style={{display:'grid',gap:'var(--space-4)'}}>
        <div style={{border:'2px dashed var(--border-strong)',borderRadius:'var(--radius-md)',padding:'var(--space-8)',textAlign:'center',color:'var(--text-muted)',fontSize:14}}>Arrastrá tus archivos o hacé clic para elegirlos</div>
        <Input label="Comentario para el docente" placeholder="Opcional"/>
      </div>
    </Modal>
  </div>;
}
</script>
<script type="text/babel">
const {Card,SectionHeading,InfoList}=window.CFP401AvellanedaDesignSystem_6c39ff;
function App(){
  const [logged,setLogged]=React.useState(false);
  const [page,setPage]=React.useState('Inicio');
  if(!logged) return <LoginScreen onLogin={()=>setLogged(true)}/>;
  return <CampusShell page={page} onNavigate={setPage} onLogout={()=>{setLogged(false);setPage('Inicio')}}>
    {(page==='Inicio'||page==='Mis cursos')&&<DashboardScreen onOpenCourse={()=>setPage('Curso')}/>}
    {page==='Curso'&&<CourseScreen/>}
    {page==='Calificaciones'&&<Card padding="var(--space-8)"><SectionHeading overline="Ciclo en curso" title="Calificaciones por curso"/><InfoList style={{marginTop:24}} items={[{label:'Soldador MIG-TIG:',value:'8,5 — 2 de 3 instancias'},{label:'Domótica y Robótica:',value:'7,0 — 1 de 3 instancias'},{label:'Contenido audiovisual:',value:'9,0 — 3 de 3 instancias'}]}/></Card>}
    {page==='Mensajes'&&<Card padding="var(--space-8)"><SectionHeading overline="Bandeja" title="Mensajes"/><InfoList style={{marginTop:24}} items={[{label:'Prof. R. Giménez:',value:'Revisá la consigna del viernes.'},{label:'Secretaría:',value:'Acercate a firmar la planilla de asistencia.'}]}/></Card>}
  </CampusShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
