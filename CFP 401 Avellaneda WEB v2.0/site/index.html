/* =========================================================================
   AJUSTES PARA CELULARES
   El design system compilado (_ds_bundle.js) está calibrado para escritorio:
   los espaciados son fijos, el lente de fotos se achica y se desvanece, y el
   avioncito anima una propiedad que el navegador no puede acelerar por GPU.
   Como el bundle no se puede editar, se corrige desde acá.
   ========================================================================= */

/* 1. Aire vertical. --section-y y --gutter son fijos en 80 y 24 px: en una
      pantalla de 390 px eso deja secciones larguísimas y medio vacías. */
@media (max-width:760px){
  :root{--section-y:48px;--gutter:18px}
}

/* 2. Header. El logo institucional es una pieza apaisada de 9,4:1: a una
      altura legible ocupa 320 px y no deja lugar para el botón al lado.
      En celular queda el logo en su propia fila y abajo menú + botón.
      Todas las palabras del menú tienen el mismo tamaño de fuente exacto (13.5px). */
@media (max-width:760px){
  header>div:last-of-type{padding:8px var(--gutter)!important;display:flex!important;justify-content:space-between!important;align-items:center!important;row-gap:6px!important;column-gap:8px!important}
  header>div:last-of-type>div:first-child{order:1!important;flex:0 1 auto!important;margin:0!important}
  header>div:last-of-type>div:first-child img{max-height:26px!important;width:auto!important}
  header>div:last-of-type>button{order:2!important;flex:0 0 auto!important;margin:0!important;padding:4px 10px!important;font-size:11.5px!important;border-radius:999px!important;height:28px!important;min-height:28px!important}
  header>div:last-of-type>nav{order:3!important;flex:1 0 100%!important;margin-left:0!important;display:flex!important;justify-content:space-between!important;column-gap:4px!important;row-gap:2px!important;padding-top:4px!important;border-top:1px solid rgba(0,0,0,0.05)!important}
  header nav a, header nav div>a, header nav a span{font-size:11.5px!important;font-weight:600!important;padding-bottom:2px!important}
}

/* 3. Hero. El bloque de texto traía 80 px de padding arriba y abajo.
      Se elimina el clipping y transform estático que causaba que el título desaparezca al scrollear en celular. */
@media (max-width:760px){
  section:has(.cfp-lens)>div:last-child{padding:var(--space-10) var(--gutter) var(--space-12)!important}
  .cfp-line-mask{overflow:visible!important}
  .cfp-line-in{transform:none!important;animation:none!important;opacity:1!important}
  h1{-webkit-transform:translateZ(0);transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;position:relative;z-index:2}
}

/* 4. Lente de fotos. El bundle trae  .cfp-lens{opacity:.32}  debajo de 980 px
      y un ancho de 48vw, que en un celular son 187 px casi transparentes.
      Se agranda, se reubica y se le devuelve opacidad.
      Nota: el bundle inyecta su <style> dentro del <section>, es decir después
      de este bloque, así que hace falta ganarle en especificidad (div.cfp-lens)
      y no solo con !important. */
@media (max-width:980px){
  div.cfp-lens{opacity:.85!important;width:min(62vw,420px)!important;right:-12%!important}
}
@media (max-width:760px){
  div.cfp-lens{opacity:.68!important;width:min(78vw,340px)!important;right:-24%!important;top:50%!important}
}

/* 4b. Franja amarilla de avisos: en celular el botón quedaba colgado a la
       derecha. Pasa a ocupar el ancho completo. */
@media (max-width:760px){
  section[style*="--surface-accent"]>div{gap:10px!important;padding-top:14px!important;padding-bottom:14px!important}
  section[style*="--surface-accent"] button{margin-left:0!important;width:100%!important}
}

/* =========================================================================
   7. FONDO AZUL DE "CÓMO INSCRIBIRTE" Y DEL PIE
   Los dos bloques salían del mismo token plano (--surface-inverse, #002878).
   Se reemplaza por el mismo lenguaje visual del hero: halos radiales, el
   isotipo institucional en sobreimpresión y trama de puntos en dos esquinas.
   Todo es CSS sobre los elementos existentes; no hace falta tocar app.js.
   ========================================================================= */
#como-inscribirte, footer{
  position:relative;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(90% 110% at 88% 8%, rgba(8,72,208,.55) 0%, rgba(8,72,208,0) 60%),
    radial-gradient(70% 95% at 4% 102%, rgba(0,80,176,.38) 0%, rgba(0,80,176,0) 64%),
    linear-gradient(135deg, var(--blue-700) 0%, var(--blue-800) 46%, var(--blue-900) 100%);
}
/* El contenido tiene que quedar por encima de las dos capas decorativas. */
#como-inscribirte>div, footer>div{position:relative;z-index:2}

/* Arco institucional (el mismo archivo que usa el hero) en sobreimpresión.
   Va SOLO en "Cómo inscribirte": las dos secciones son contiguas, así que si
   el pie también lo lleva, los dos arcos se encuentran en el límite y se leen
   como un isotipo duplicado. El pie conserva degradado y puntos. */
#como-inscribirte::before{
  content:'';position:absolute;z-index:1;pointer-events:none;
  top:-14%;right:-16%;height:128%;aspect-ratio:928/695;
  background:url('assets/isotipo-arco-blanco.png') no-repeat center/contain;
  opacity:.13;mix-blend-mode:soft-light;
}
/* Trama de puntos, desvanecida hacia el centro. */
#como-inscribirte::after, footer::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.22) 1.3px, transparent 1.4px);
  background-size:20px 20px;
  -webkit-mask-image:radial-gradient(38% 42% at 97% 6%, #000 0%, transparent 72%),
                     radial-gradient(34% 30% at 3% 96%, #000 0%, transparent 72%);
          mask-image:radial-gradient(38% 42% at 97% 6%, #000 0%, transparent 72%),
                     radial-gradient(34% 30% at 3% 96%, #000 0%, transparent 72%);
}

/* =========================================================================
   8. AIRE DEL PIE EN CELULAR
   Con una sola columna, el hueco entre bloques es el row-gap de la grilla
   (40 px) y el de los enlaces es el gap de cada lista (10 px). Medido de
   borde de texto a borde de texto, el hueco real era de 54 px y 10 px.
   Se ajustan para que queden en la mitad: 27 px y 5 px.
   ========================================================================= */
@media (max-width:760px){
  footer>div:first-of-type{row-gap:var(--space-3)!important}
  footer ul{row-gap:5px!important}
}

/* 5. Avioncito. El vuelo del design system (offset-distance + máscara SVG con
      stroke-dashoffset) se reemplazó por una versión que solo anima transform
      y opacity, que es lo que el compositor sí acelera por GPU. Vive en
      app.js (componente VueloAvion) y se monta con un portal dentro del hero;
      el Hero se instancia con plane={false} para que el bundle no dibuje el
      suyo. Esta regla queda por si alguien vuelve a activarlo. */
div.cfp-flight{display:none!important}

/* 6. Rotación de fotos del lente. El bundle la anima con clip-path (una
      cortina que barre la foto de izquierda a derecha) sobre cinco imágenes
      grandes. clip-path tampoco se compone por GPU: era, medido, el mayor
      generador de repintados del hero, más caro todavía que el avión.
      Se reemplaza por fundido + escala, que sí son propiedades compuestas.
      Se pierde el barrido; dentro de un círculo de 300 px no se notaba. */
@keyframes cfpFotoGPU{
  0%{opacity:0;transform:scale(1.16)}
  2%{opacity:1}
  13%{opacity:1;transform:scale(1.03)}
  16.5%{opacity:0;transform:scale(1.005)}
  100%{opacity:0;transform:scale(1.16)}
}
img.cfp-shot{animation-name:cfpFotoGPU!important;clip-path:none!important;
  will-change:opacity,transform!important}
/* La regla anterior tiene más especificidad que la de prefers-reduced-motion
   del bundle (img.cfp-shot vs .cfp-shot), así que hay que repetirla acá o
   quien pida menos movimiento igual vería las fotos rotando. */
@media (prefers-reduced-motion:reduce){
  img.cfp-shot{animation:none!important;opacity:0!important}
  img.cfp-shot:first-of-type{opacity:1!important}
}

.cfp-cinta-efemerides{background:linear-gradient(90deg,#e0f2fe 0%,#f0f9ff 50%,#e0f2fe 100%);border-bottom:1px solid #bae6fd;color:#034574;padding:6px 14px;position:relative;z-index:101;box-shadow:0 1px 3px rgba(0,40,120,0.05);animation:fadeInMenu .25s ease-out}

@media (max-width:760px){

  .cfp-cinta-line2{font-size:10.5px!important;line-height:1.2!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
  .cfp-cinta-actions{gap:4px!important}

  /* Área de toque más grande (≈44 px de alto) sin cambiar cómo se ven los botones */
  .cfp-cinta-btn-cal,.cfp-cinta-btn-close{position:relative}
  .cfp-cinta-btn-cal::after,.cfp-cinta-btn-close::after{content:'';position:absolute}
  .cfp-cinta-btn-cal::after{inset:-12px -2px}

/* =========================================================================
   MODALES DEL DESIGN SYSTEM (AGENDA / CAMPUS)
   Van por encima del encabezado fijo (z-index 100; si no, les tapa el título)
   y, si no entran en la pantalla, se desplazan por dentro.
   ========================================================================= */
div[style*="z-index: 60"][style*="position: fixed"] {
  z-index: 200 !important;
  overflow-y: auto !important;
}
div[style*="z-index: 60"][style*="position: fixed"] > div {
  max-height: calc(100vh - 48px) !important;
  max-height: calc(100dvh - 48px) !important;
  display: flex !important;
  flex-direction: column !important;
  overflow-y: auto !important;
}
div[style*="z-index: 60"][style*="position: fixed"] > div > div:last-child {
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch !important;
}
/* La lista de la Agenda se acorta según el alto de la pantalla para que el botón "Entendido" quede a la vista */
div[style*="z-index: 60"][style*="position: fixed"] div[style*="max-height: 420px"] {
  max-height: max(180px, min(420px, calc(100vh - 460px))) !important;
  max-height: max(180px, min(420px, calc(100dvh - 460px))) !important;
}
@media (max-width:760px){
  div[style*="z-index: 60"][style*="position: fixed"] {
    padding: 12px !important;
    align-items: flex-start !important;
  }
  div[style*="z-index: 60"][style*="position: fixed"] > div {
    max-height: calc(100vh - 24px) !important;
    max-height: calc(100dvh - 24px) !important;
    margin: auto 0 !important;
    border-radius: var(--radius-lg, 14px) !important;
  }
}

@keyframes fadeInPromoOverlay {
